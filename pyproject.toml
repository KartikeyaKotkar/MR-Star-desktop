[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mrstar-desktop"
version = "1.0.0"
description = "Cross-platform desktop controller for MR Star BLE light strips"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MR Star Desktop contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "PySide6-Essentials>=6.8,<6.12",
    "bleak>=3.0,<4",
    "numpy>=1.26,<3",
    "sounddevice>=0.4.6,<1",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]

[project.gui-scripts]
mrstar = "mrstar.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mrstar*"]

[tool.setuptools.package-data]
mrstar = ["assets/*.png", "assets/*.ico", "assets/*.icns"]
