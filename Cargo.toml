[package]
name = "mrstar"
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
description = "Native desktop controller for MR Star BLE light strips"
repository = "https://github.com/KartikeyaKotkar/MR-Star-desktop"
readme = "README.md"
license = "MIT"

[dependencies]
btleplug = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
futures = "0.3"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
