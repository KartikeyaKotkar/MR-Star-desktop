name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            archive: tar.gz
          - os: windows-latest
            name: windows-x86_64
            archive: zip
          - os: macos-15-intel
            name: macos-x86_64
            archive: zip
          - os: macos-15
            name: macos-arm64
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libportaudio2 \
            libxcb-cursor0 \
            libxkbcommon0

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=$(python -c 'import mrstar; print(mrstar.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build frozen application
        run: pyinstaller --clean --noconfirm packaging/mrstar.spec

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x dist/MRStar/MRStar
          dist/MRStar/MRStar --smoke-test

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          & "dist/MRStar/MRStar.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          QT_QPA_PLATFORM=offscreen "dist/MR Star.app/Contents/MacOS/MRStar" --smoke-test

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/MRStar-${{ steps.version.outputs.value }}-${{ matrix.name }}.tar.gz" -C dist MRStar

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path "dist/MRStar" -DestinationPath "release/MRStar-${{ steps.version.outputs.value }}-${{ matrix.name }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/MR Star.app" "release/MRStar-${{ steps.version.outputs.value }}-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: MR Star Desktop ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
