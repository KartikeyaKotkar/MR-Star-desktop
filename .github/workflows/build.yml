name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            name: windows-x86_64
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-15-intel
            name: macos-x86_64
            target: x86_64-apple-darwin
            archive: zip
          # Cross-compile arm64 on the Intel runner; arm64 hosted runners are capacity constrained.
          - os: macos-15-intel
            name: macos-arm64
            target: aarch64-apple-darwin
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        if: matrix.target != 'aarch64-apple-darwin'
        run: cargo test --locked --release --target "${{ matrix.target }}"

      - name: Build
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Smoke test and enforce 20 MiB ceiling
        shell: bash
        run: |
          EXE="target/${{ matrix.target }}/release/mrstar"
          if [ "${{ runner.os }}" = "Windows" ]; then EXE="$EXE.exe"; fi
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            file "$EXE"
            lipo -archs "$EXE"
            lipo -archs "$EXE" | grep -qw arm64
          else
            "$EXE" --smoke-test
          fi
          bytes=$(wc -c < "$EXE")
          echo "${{ matrix.name }} binary: $bytes bytes"
          if [ "$bytes" -gt 20971520 ]; then
            echo "::error::${{ matrix.name }} binary exceeds 20 MiB: $bytes bytes"
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ASSET="MRStar-${VERSION}-${{ matrix.name }}"
          EXE="target/${{ matrix.target }}/release/mrstar"
          if [ "${{ runner.os }}" = "Windows" ]; then EXE="$EXE.exe"; fi
          mkdir -p "dist/$ASSET" release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$EXE" "dist/$ASSET/MRStar.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            APP="dist/$ASSET/MR Star.app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp "$EXE" "$APP/Contents/MacOS/MRStar"
            cp macos/Info.plist "$APP/Contents/Info.plist"
            cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
            codesign --force --deep --sign - "$APP"
          else
            cp "$EXE" "dist/$ASSET/MRStar"
          fi
          cp README.md "dist/$ASSET/README.md"
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -czf "release/$ASSET.tar.gz" -C dist "$ASSET"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/$ASSET' -DestinationPath 'release/$ASSET.zip'"
          else
            (cd dist && zip -ry "../release/$ASSET.zip" "$ASSET")
          fi
          archive="release/$ASSET.${{ matrix.archive }}"
          archive_bytes=$(wc -c < "$archive")
          echo "${{ matrix.name }} archive: $archive_bytes bytes"
          if [ "$archive_bytes" -gt 20971520 ]; then
            echo "::error::${{ matrix.name }} archive exceeds 20 MiB: $archive_bytes bytes"
            exit 1
          fi
          ls -lh "$archive"

      - uses: actions/upload-artifact@v4
        with:
          name: mrstar-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: MR Star Desktop ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
