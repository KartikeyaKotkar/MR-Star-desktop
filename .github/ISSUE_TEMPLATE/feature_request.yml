name: Feature request
description: Suggest a useful addition or compatibility improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour you would like.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: APK or hardware evidence
      description: For protocol work, include decompiled evidence or hardware captures.
